name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: mobi
          POSTGRES_PASSWORD: mobi
          POSTGRES_DB: mobilidade_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mobi" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://mobi:mobi@localhost:5432/mobilidade_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build do pacote compartilhado
        run: pnpm --filter @mobigo/shared build
      - name: Typecheck
        run: pnpm typecheck
      - name: Testes (unitários + integração com PostGIS e Redis)
        run: pnpm test
      - name: Build de produção
        run: pnpm --filter @mobigo/api build && pnpm --filter @mobigo/web build

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t mobigo-api .
      - run: docker build -f apps/web/Dockerfile -t mobigo-web .
