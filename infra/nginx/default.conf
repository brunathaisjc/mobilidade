# Front-end estático + proxy para a API. Em produção, um balanceador/CDN fica na frente (TLS, HTTP/2).
upstream api { server api:3000; keepalive 32; }

server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self' https://tiles.openfreemap.org; font-src 'self' https:; frame-ancestors 'none'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  # SSE: sem buffer e com timeout longo
  location /api/realtime/stream {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location ~ ^/(api|media)/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;
  }

  # SPA: rotas do React Router
  location / { try_files $uri /index.html; }
}
